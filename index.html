<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080907">
<meta name="description" content="FESTORA — Our Onam Story, 2026 Onam Celebration.">
<title>FESTORA — Our Onam Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@400;500;600&family=Allura&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="loader" id="loader"><div class="loader-lotus">✧</div><strong>FESTORA</strong><small>OUR ONAM STORY</small></div>

<header class="site-header">
  <a class="brand-hotspot" href="#home" aria-label="FESTORA Home"></a>
  <nav class="desktop-hotspots" aria-label="Main navigation">
    <a href="#home" aria-label="Home"></a>
    <a href="#gallery" aria-label="Celebration"></a>
  </nav>
  <button class="hamburger" id="menuButton" aria-label="Open menu" aria-expanded="false" type="button"><span></span><span></span><span></span></button>
</header>

<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
  <button class="menu-close" id="menuClose" aria-label="Close menu" type="button">×</button>
  <div class="mobile-menu-inner">
    <div class="menu-brand">FESTORA</div>
    <a href="#home" class="mobile-link">Home</a>
    <a href="#gallery" class="mobile-link">Celebration</a>
  </div>
</div>

<main>
<section id="home" class="hero" aria-label="FESTORA Our Onam Story">
  <img class="hero-art" src="assets/images/hero/festora-home.png" data-fallback="assets/images/hero/pookalam-placeholder.svg" alt="Festive Onam pookalam with lamps and FESTORA title">
  <div class="hero-mobile-shade"></div>
  <a class="hero-button-hotspot" href="#gallery" aria-label="View celebration"></a>
  <div class="hero-scroll" aria-hidden="true"><span></span><b>↓</b></div>
</section>

<section id="gallery" class="gallery-section">
  <div class="container-fluid px-3 px-md-5">
    <div class="section-head">
      <div>
        <div class="eyebrow">2026 ONAM CELEBRATION</div>
        <h2>Celebration</h2>
        <p>Ten frames from a day we shared together.</p>
      </div>
      <div class="count">10 PHOTOS</div>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</section>

<section class="closing">
  <div class="closing-mark">F</div>
  <div>FESTORA · OUR ONAM STORY · 2026</div>
</section>
</main>

<footer><strong>FESTORA</strong><span>Created by Thomas Mathew</span></footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="light-close" id="lightClose" aria-label="Close photo">×</button>
  <button class="light-arrow left" id="prev" aria-label="Previous photo">‹</button>
  <div class="light-content"><img id="lightImage" alt=""><div id="lightTitle"></div><small id="lightCount"></small></div>
  <button class="light-arrow right" id="next" aria-label="Next photo">›</button>
</div>
<script src="script.js"></script>
</body>
</html>
